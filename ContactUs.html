<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyDesign Contact Us Page</title>
    <link rel="stylesheet" href="style.css" />
    <!-- A link to generate icons for the website -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- Header Section -->
    <header>
      <div class="logo">
        <a href="#">My<span class="span">Design</span></a>
      </div>

      <nav>
        <ul class="nav-links">
          <li>
            <a href="./index.html">Home</a>
          </li>

          <li>
            <a href="./About.html">About</a>
          </li>

          <li>
            <a href="./Service.html">Services</a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <!-- Contact Me Section -->
      <section class="contact-section">
        <h2><span class="span">C</span>ontact <span class="span">U</span>s</h2>
        <div class="contact-container">
          <img src="./Images/contact-me-2.jpg" alt="Contact Me picture" />
          <form
            action="https://formsubmit.co/moidriz91@gmail.com"
            method="POST"
            class="contact-form"
          >
            <label
              >Name
              <input
                type="text"
                id="text"
                name="text"
                placeholder="Enter your name ..."
                required
              />
            </label>
            <label
              >Email
              <input
                type="email"
                id="email"
                name="email"
                placeholder="enter your email ..."
                required
              />
            </label>
            <label
              >Message
              <textarea
                name="Message"
                id="Message"
                placeholder="Write your message here ..."
                rows="5"
                required
              ></textarea>
            </label>
            <button type="submit" class="btn-primary-form">Submit</button>
          </form>
          <!-- <div class="contact-info">
            <h3>Get in touch</h3>
            <p>
              <i class="fa-solid fa-location-dot"></i>21 Metege road Navan,
              Ireland
            </p>
            <p><i class="fa-solid fa-phone"></i>+353899464114</p>
            <p><i class="fa-solid fa-envelope"></i>email@mycompany.com</p>
          </div> -->
        </div>
      </section>
    </main>
    <!-- Footer Section -->
    <footer>
      <div class="footer-container">
        <div class="footer-content">
          <p>&copy; 2026 MyDesign Company | All rights reserved</p>
          <div class="social-icons">
            <!-- Youtube Icon -->
            <a
              href="https://www.youtube.com"
              aria-label="Youtube"
              title="Youtube"
            >
              <i class="fa-brands fa-youtube you-red"></i>
            </a>
            <!-- LinkedIN Icon -->
            <a
              href="https://www.linkedin.com"
              aria-label="LinkedIN"
              title="LinkedIN"
            >
              <i class="fa-brands fa-square-linkedin link-blue"></i>
            </a>
            <!-- X Icon -->
            <a
              href="https://www.x.com"
              aria-label="X Website"
              title="X Website"
            >
              <i class="fa-brands fa-x-twitter x-black"></i>
            </a>
          </div>
          <ul class="footer-links">
            <!-- <li><a href="#">Home</a></li> -->
            <li><a href="./About.html">About</a></li>
            <li><a href="./Service.html">Services</a></li>
            <li><a href="./ContactUs.html">Contact Us</a></li>
            <li><a href="#">Term of Services</a></li>
            <li><a href="#">Privacy Policy</a></li>

            <p>
              <i class="fa-solid fa-location-dot"></i>21 Metege road Navan,
              Ireland
            </p>
            <p><i class="fa-solid fa-phone"></i>+353899464114</p>
            <p><i class="fa-solid fa-envelope"></i>email@mycompany.com</p>
          </ul>
        </div>
      </div>
    </footer>
  </body>
</html>
